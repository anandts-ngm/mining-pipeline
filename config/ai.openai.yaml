ai:
  profile: ai-first
  enabled: true
  provider: openai
  provider_model: gpt-5.6-terra
  reasoning_effort: max
  reasoning_mode: pro
  text_verbosity: medium
  store_responses: false
  external_data_allowed: true
  request_timeout_seconds: 3600
  max_output_tokens: 32768
  # The cost ceiling is a pre-flight bound on the estimate for the sources a run selects, not a
  # budget for the catalogue. One source estimates 11.00 (2.00 legend + 5.00 feature + 4.00
  # critique), so 15.00 funds exactly one source per run and hard-stops an accidental multi-source
  # run before a single request is sent. Extract incrementally with --ai-source and the whole
  # catalogue costs the same 66.00 spread across runs you choose to make.
  #
  # The request ceiling is a different constraint and was the real blocker: a single source needs a
  # legend, a critique and one or more feature requests, because large maps tile past
  # max_input_images_per_request. At 4 requests even one source could not complete.
  max_requests_per_run: 64
  max_input_images_per_request: 24
  max_input_bytes_per_request: 100000000
  max_cost_per_run_usd: "15.00"
  concurrency: 1
  source_egress_policy: require-explicit-approval
  review_policy:
    require_named_reviewer: false
    high_risk_requires_geologist: false
    production_geometry_requires_approval: false
  phase03_workflow:
    # A live run must select an exact source ID. This keeps source-specific interpretations and
    # cost approvals separate; the CLI will not send this whole catalog accidentally.
    sources:
      - source_id: regional-geology-1987-200k
        legend_source: phase03-registered-sources/1987_MN_L47-XIX_GeologicalMap_Legend_1-200000_v01_raw-scan.jpg
        feature_source: phase03-imported-sources/regional-geology-1987-200k/source/XV023222_Buduunkhad_1987_L47-XIX_GeologicalMap_1-200000_Georeferenced_EPSG32647_v01.tif
      - source_id: detailed-geology-2013-50k
        legend_source: phase03-registered-sources/2013_MN_Namalzakh_L47-74-A_GeologicalMap_Legend_1-50000_v01_raw-scan.jpg
        feature_source: phase03-imported-sources/detailed-geology-2013-50k/source/XV023222_Buduunkhad_2013_L47-74-A_GeologicalMap_1-50000_Georeferenced_EPSG32647_v01.tif
      - source_id: regional-metallogeny-2020-500k
        legend_source: phase03-registered-sources/Regional_MetallogenicMap_L47B_Talshand_1M500K_Legend_RawScan_2020_v01.jpg
        feature_source: phase03-imported-sources/regional-metallogeny-2020-500k/source/regional_metallogenic_map_500k_georef_EPSG32647_v01.tif
      - source_id: mineral-distribution-2013-100k
        legend_source: phase03-registered-sources/2013_MN_Namalzakh_L47-73-74_MineralDistributionPatternMap_1-100000_v01_raw-scan.jpg
        feature_source: phase03-imported-sources/mineral-distribution-2013-100k/source/XV023222_Buduunkhad_2013_L47-73-74_MineralDistributionPatternMap_1-100K_Georeferenced_EPSG32647_v01.tif
      - source_id: prospectivity-2013-50k
        legend_source: phase03-registered-sources/2013_MN_Namalzakh_L47-74-A_ProspectivityAssessmentMap_1-50000_v01_raw-scan.jpg
        feature_source: phase03-imported-sources/prospectivity-2013-50k/source/XV023222_Buduunkhad_2013_L47-74-A_ProspectivityAssessmentMap_1-50K_Georeferenced_EPSG32647_v01.tif
      - source_id: source-materials-2013-50k
        legend_source: phase03-registered-sources/2013_MN_Namalzakh_L47-74-A_SourceMaterialsMap_Legend_1-50000_v01_raw-scan.jpg
        feature_source: phase03-imported-sources/source-materials-2013-50k/source/XV023222_Buduunkhad_2013_L47-74-A_SourceMaterialsMap_1-50K_Georeferenced_EPSG32647_v01.tif
    legend_tile_size: 4096
    legend_overlap: 256
    feature_tile_size: 1536
    feature_overlap: 128
    legend_estimated_cost_usd: "2.00"
    feature_estimated_cost_usd: "5.00"
    critique_estimated_cost_usd: "4.00"
