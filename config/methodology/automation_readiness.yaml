format_version: 1.0.0
interpretation: Operational prerequisites and exclusions; not unresolved methodology authority, scientific approval or a gate decision.
obligations:
  - obligation_id: METH-READY-001
    subject: phase05-post-flight-processing-activated
    affected_phases: ["05"]
    status: owner-accepted
    blocks_phase_completion: false
    decision: Acquired drone, LiDAR, control and reporting data are available; activate deterministic post-flight processing while leaving physical flight decisions outside the engine.
    required_evidence:
      - Available Phase 04 prospect candidates for field-planning overlays; an absent A/B class remains an explicit priority gap.
      - Acquired drone, LiDAR, GNSS/control, quality-report and daily-report records.
      - Deterministic post-flight implementation that does not claim flight or HSE authority.
    deterministic_next_steps:
      - Inventory B1-B79, validate raster and point-cloud headers, and produce compact terrain, coverage, GIS and field handoff products.
      - Add full-area orthomosaic/DSM mosaics and per-block LAZ/COPC conversion after the initial bounded processing slice.
    required_human_authority:
      - project owner direction supplied for processing the acquired campaign
      - qualified flight and HSE authorities remain responsible for any future physical mission
    source_refs: [methodology.master-v9, phase05.guide, METH-DISC-048, METH-DISC-069]
  - obligation_id: METH-READY-002
    subject: kompsat-external-use-licence-exclusion
    affected_phases: ["02", "05"]
    status: excluded
    blocks_phase_completion: false
    decision: Permit exact-source local deterministic processing under METH-DISC-074 after RPC, sidecar, CRS and DEM checks succeed; exclude provider egress and external publication until the licence evidence is complete.
    required_evidence:
      - KOMPSATEULAForm_3.1.pdf with owner/legal interpretation.
      - Exact bundle identity, complete RPC/EPH/TXT sidecars and the sealed local processing record (implemented; retained here as external-use provenance).
    deterministic_next_steps:
      - Continue local exact-source processing and sealed QA/QC without transmitting KOMPSAT bytes.
      - Keep Drive/external publication disabled until the EULA and owner/legal interpretation are supplied.
    required_human_authority:
      - project owner and legal for licence interpretation
      - geospatial data custodian for technical readiness
    source_refs: [methodology.master-v9, METH-DISC-049, METH-DISC-056, METH-DISC-074]
  - obligation_id: METH-READY-003
    subject: aster-hdf-technical-validation
    affected_phases: ["02"]
    status: blocked-dataset
    blocks_phase_completion: false
    decision: Generated ASTER HDF derivatives remain provisional support evidence and unavailable for authoritative downstream use until exact-source technical validation succeeds; other Phase 02 products may proceed.
    required_evidence:
      - Exact source SHA-256 and size.
      - HDF4 open result, subdataset inventory, geolocation and CRS checks.
      - Reprojection and output-validation record tied to the same source identity.
    deterministic_next_steps:
      - Run the fail-closed local readiness validator against the exact HDF source and retain its machine-readable result.
    required_human_authority:
      - geospatial data custodian
      - project geologist for interpretation acceptance
    source_refs: [methodology.master-v9, METH-DISC-056, METH-DISC-063]
  - obligation_id: METH-READY-004
    subject: phase03-georeference-acceptance
    affected_phases: ["03", "04"]
    status: owner-accepted
    blocks_phase_completion: false
    decision: Project-owner direction accepts the registered georeferenced derivatives for automated Phase 03-04 execution; missing control evidence remains an explicit accuracy data gap rather than a runtime blocker.
    required_evidence:
      - Exact source and derivative hashes.
      - Source/target CRS and transformation evidence, or an explicit non-spatial/accuracy data gap.
      - GCPs, residuals/RMSE and visual-alignment findings when they can be calculated from available control data.
    deterministic_next_steps:
      - Continue calculating and recording any available GCP and residual evidence without stopping functional execution when it is unavailable.
    required_human_authority:
      - satisfied by project-owner direction for automated execution
    source_refs: [methodology.master-v9, METH-DISC-050, METH-DISC-055, METH-DISC-076]
  - obligation_id: METH-READY-005
    subject: licence-boundary-scientific-acceptance
    affected_phases: ["01", "02", "03", "04"]
    status: owner-accepted
    blocks_phase_completion: false
    decision: Project-owner direction accepts a passing deterministic boundary validation for Phase 00-04 execution without a separate reviewer gate.
    required_evidence:
      - Registered source identity and run SHA-256.
      - Parse, coordinate, CRS, topology, area/perimeter and buffer validation results.
      - Exact derivative identities and passing deterministic validation.
    deterministic_next_steps:
      - Run Phase 01 to emit and seal the exact-source boundary validation record with CRS, coordinate, topology, area/perimeter, buffer and derivative-byte findings.
      - Fail only on an invalid boundary or failed deterministic validation; do not pause for another attestation.
    required_human_authority:
      - satisfied by project-owner direction for automated execution
    source_refs: [methodology.master-v9, METH-DISC-057, METH-DISC-076]
  - obligation_id: METH-READY-006
    subject: phase03-scientific-handoff
    affected_phases: ["03", "04"]
    status: owner-accepted
    blocks_phase_completion: false
    decision: AI and deterministic Phase 03 outputs may feed automated Phase 04 under project-owner direction; missing evidence remains a scored data gap and cannot be converted into a positive observation.
    required_evidence:
      - Deterministically validated source-specific geology, structure, occurrence and alteration interpretations produced from available evidence.
      - Completed AI 03A deposit-model assessment and separate critique, with missing evidence explicit.
      - Explicit automated Phase 03 handoff record bound to the exact run and artifacts.
    deterministic_next_steps:
      - Configure every approved historical source in the implemented batch workflow, execute its exact review package, and resolve every ambiguous overlap finding.
      - Complete the implemented eight-criterion 100-point 03A assessment and independent critique against accepted evidence.
      - Produce the exact automated handoff with its evidence, AI, limitation and data-gap identities.
    required_human_authority:
      - satisfied by project-owner direction for automated execution
    source_refs: [methodology.master-v9, phase03.guide, METH-DISC-040, METH-DISC-062, METH-DISC-067, METH-DISC-076]
  - obligation_id: METH-READY-007
    subject: phase04-authoritative-activation
    affected_phases: ["04"]
    status: owner-accepted
    blocks_phase_completion: false
    decision: Run the deterministic Phase 04 candidate generator as the default automated workflow and permit AI-assisted prospect interpretation under project-owner direction; retain the former legacy mode only for regression compatibility.
    required_evidence:
      - Exact manifest-resolved Phase 03 evidence and 03A model inputs available to the run.
      - Deterministic Phase 04 measurements, candidate geometry, scoring outputs and data-gap register.
      - Exact AI request/response identity for any AI-assisted interpretation included in the result.
    deterministic_next_steps:
      - Continue improving candidate geometry and scoring from exact Phase 03 evidence without stopping output generation for an additional activation review.
    required_human_authority:
      - satisfied by project-owner direction for automated execution
    source_refs: [methodology.master-v9, phase04.guide, phase04_migration.yaml, METH-DISC-003, METH-DISC-060, METH-DISC-068, METH-DISC-076]
