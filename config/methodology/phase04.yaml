format_version: 1.0.0
phase_id: "04"
requirements:
  - requirement_id: P04-PROPOSAL-ONLY-001
    statement: AI may interpret evidence and propose prospect geometry, rationale, limitations and ranking; deterministic code validates, measures and packages every automated result.
    source_refs: [repository.methodology-contracts, phase04.guide, METH-DISC-076]
    status: adopted
  - requirement_id: P04-LEGACY-COMPARATOR-001
    statement: The unchanged fixed-grid evidence method is the default automated candidate generator and retains legacy-comparator mode for regression; phase04_migration.yaml describes an optional reviewed prospect-polygon workflow.
    source_refs: [methodology.master-v9, repository.methodology-contracts, phase04.guide, METH-DISC-003, METH-DISC-041, METH-DISC-060, METH-DISC-068, METH-DISC-076]
    status: adopted
  - requirement_id: P04-SCORING-MATRIX-PRESERVATION-001
    statement: The implemented Phase 04 desktop criterion weights remain unchanged for reproducible automated ranking; phase04_migration.yaml specifies the optional ranged prospect-level contract, while the master lifecycle matrix stays reserved for Phase 10.
    source_refs: [repository.methodology-contracts, phase04.guide, METH-DISC-006, METH-DISC-041, METH-DISC-068, METH-DISC-076]
    status: adopted
  - requirement_id: P04-AI-ISOLATION-001
    statement: AI proposal and review lifecycle records retain their original identities; Phase 04 may use only exact manifest-resolved evidence and cannot infer authority from a filename or directory.
    source_refs: [repository.methodology-contracts, METH-DISC-076]
    status: adopted
  - requirement_id: P04-EVIDENCE-AUTHORITY-001
    statement: Attribute-bearing evidence used by automated Phase 04 must resolve through an immutable manifest and catalog admission event with an exact source artifact, layer, explicit evidence role and compatible eligibility; filename keywords and directory proximity have no authority.
    source_refs: [repository.methodology-contracts, methodology.master-v9, METH-DISC-076]
    status: adopted
  - requirement_id: P04-GATE-PROVISIONAL-001
    statement: An exact sealed Phase 03 run with passing deterministic QA/QC may feed automated Phase 04; unresolved or unavailable evidence remains zero-scored and explicit, while deterministic failures still block execution.
    source_refs: [repository.methodology-contracts, METH-DISC-031, METH-DISC-062, METH-DISC-067, METH-DISC-072, METH-DISC-076]
    status: adopted
