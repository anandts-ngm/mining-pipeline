format_version: 1.0.0
# Per-phase automation boundaries migrated from the deleted AUTOMATION_ASSESSMENT.md
# (2026-07-07). Only durable boundaries are recorded: what deterministic code owns,
# where human review is mandatory, what AI may and may not do, and known blocking
# dependencies. The historical automation percentages and maturity estimates were
# engineering estimates, not contracts, and were intentionally not migrated.
boundaries:
  - phase_id: "00"
    automation_category: desktop-deterministic
    deterministic_authority:
      - SHA-256 checksums, raw identity, sidecar bundle detection, working-copy creation, inventory.
    human_review_boundary:
      - Optional audit of deliberate raw-identity changes; deterministic identity failures still stop execution.
    ai_permitted:
      - Metadata enrichment suggestions as drafts.
    ai_prohibited:
      - Fabricating source bytes, identifiers, hashes or archive membership.
    status: implemented
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "01"
    automation_category: desktop-deterministic
    deterministic_authority:
      - Spatial/raster audit, CRS checks, boundary import, buffer rings, master GeoPackage schema, QGIS project generation.
      - Any prior Phase 00 products are consumed from the same isolated run or an exact sealed predecessor-run binding, never the mutable compatibility view.
    human_review_boundary:
      - Optional inspection of scan-map georeferencing and registration QA/QC; unavailable control evidence is recorded as a data gap.
    ai_permitted:
      - Map boundary, legend and tick extraction, GCP proposals, historical-feature proposals.
    ai_prohibited:
      - Inventing GCPs, residuals, CRS evidence or source geometry.
    blocking_dependencies: []
    status: implemented
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "02"
    automation_category: desktop-deterministic
    deterministic_authority:
      - Reprojection, per-product clipping, COG output, spectral band math, terrain derivatives, the frozen ASTER support-evidence chain, hydrology products, the machine lineament draft.
      - Prior Phase 00 and Phase 01 products resolve from the same run or exact sealed predecessor-run bindings.
    human_review_boundary:
      - Optional specialist review of imagery interpretation and any proposed new threshold.
    ai_permitted:
      - Draft interpretations of validated imagery as support evidence.
    ai_prohibited:
      - Changing existing calculations or thresholds without an approved source and methodology record.
    blocking_dependencies:
      - KOMPSAT local deterministic processing is permitted by METH-DISC-074, but METH-READY-002 still blocks provider egress and external publication; an unavailable or invalid ASTER HDF is an explicit product-level data gap while other Phase 02 products proceed.
    status: implemented
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "03"
    automation_category: desktop-orchestrated
    deterministic_authority:
      - Exact Phase 00 source traceability, scaffold, registers, evidence-GeoPackage assembly, CMCS buffers, occurrence ingest, exact manifest-resolved support-evidence ingest, and the opt-in AI-draft review packaging and promotion.
      - Evidence roles must own their exact Phase 03 target layers, and catalog admission plus predecessor-run identities remain bound into the consuming run.
      - Source-specific and batch legend/feature execution, non-destructive overlap review, content-aware QA/QC, the exact eight-criterion 100-point 03A evidence/critique records and scientific-handoff resolution.
    human_review_boundary:
      - Optional specialist correction of AI proposals, georeferencing and the 03A assessment; these reviews do not block automated output generation.
    ai_permitted:
      - Draft digitization, occurrence reconciliation, and deposit-model drafting through the review handoff.
    ai_prohibited:
      - Inventing missing map observations, coordinates, source identities or geological facts.
      - Becoming executable merely through a filename, layer name, or directory location.
    blocking_dependencies: []
    status: automated
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "04"
    automation_category: desktop-deterministic
    deterministic_authority:
      - Evidence grid, scoring arithmetic, class banding, prospect dissolution, ranking and go/no-go tables.
      - Attribute-bearing support evidence only when its exact artifact, layer, role and legacy-comparator eligibility resolve through an immutable evidence manifest.
      - Phase 01 and Phase 03 inputs come from the same run or exact sealed predecessor-run bindings; automated execution records absent criteria as zero-scored data gaps.
      - The fixed-grid workflow emits real candidate polygons and rankings; the previous legacy-comparator mode remains available only for regression compatibility.
      - A separate optional prospect-polygon implementation can measure externally supplied reviewed geometry and scorecards when those inputs exist.
    human_review_boundary:
      - Optional specialist correction or replacement of automated candidate geometry and score judgments.
    ai_permitted:
      - Prospect interpretation, evidence synthesis, rationale, limitations and ranking proposals from exact Phase 03 evidence.
    ai_prohibited:
      - Treating an absent criterion as positive or inventing geological observations.
      - Recalibrating the adopted scoring matrix as an incidental change.
    blocking_dependencies: []
    status: automated
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "05"
    automation_category: desktop-orchestrated
    deterministic_authority:
      - Acquired campaign inventory, raster and LAS header QA, coverage footprints, terrain derivatives, GIS/3D packaging and field handoff.
    human_review_boundary:
      - Flight approval, HSE, and mission constraints.
    ai_permitted:
      - Survey-priority proposals and imagery-interpretation drafts.
    ai_prohibited:
      - Flight or safety decisions, mission constraints, accuracy calculations.
    blocking_dependencies:
      - Full orthomosaic/DSM mosaics and LAZ/COPC conversion remain later processing slices; future physical flight remains outside the engine.
    status: partially-implemented
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "06"
    automation_category: field-acquisition
    deterministic_authority:
      - pXRF and observation data ingest plus QA/QC math, when built.
    human_review_boundary:
      - Geological observation and ground-truthing.
    ai_prohibited:
      - Treating pXRF or reconnaissance readings as decision evidence.
    blocking_dependencies:
      - Physical field mapping and pXRF screening.
    status: stub
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "07"
    automation_category: field-acquisition
    deterministic_authority:
      - Sample-register handling and assay QA/QC math, when built.
    human_review_boundary:
      - Sample siting and geological logging.
    ai_prohibited:
      - Converting selective samples into representative grades.
    blocking_dependencies:
      - Physical sampling and laboratory assays.
    status: stub
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "08"
    automation_category: field-acquisition
    deterministic_authority:
      - Orientation-survey data processing and QA/QC math, when built.
    human_review_boundary:
      - Method-calibration interpretation and per-element anomaly thresholds.
    ai_prohibited:
      - Setting anomaly thresholds without an approved expert record.
    blocking_dependencies:
      - Physical orientation sampling experiment.
    status: stub
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "09"
    automation_category: field-acquisition
    deterministic_authority:
      - Soil-grid geometry generation and the laboratory QA/QC engine (CRM, blank, duplicate, detection limits), when built.
    human_review_boundary:
      - Grid design acceptance and assay-quality decisions.
    ai_prohibited:
      - Treating lab QA/QC failures as passable.
    blocking_dependencies:
      - Physical collection and laboratory assays.
    status: stub
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "10"
    automation_category: desktop-integration
    deterministic_authority:
      - Integration arithmetic and the final-ranking computation using the reserved lifecycle matrix (METH-DISC-006), when built.
    human_review_boundary:
      - Qualitative sub-scoring, the deposit-model call, and go/no-go decisions.
    ai_prohibited:
      - Making the final target-ranking or go/no-go decision.
    blocking_dependencies:
      - Decision-grade field and laboratory evidence from phases 05-09.
    status: stub
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "11"
    automation_category: desktop-planning
    deterministic_authority:
      - Trench, geophysics, and drill-line geometry generation from an AOI and strike, when built.
    human_review_boundary:
      - Collar and line placement judgment; execution approvals.
    ai_prohibited:
      - Trench, geophysics, or drill safety and placement decisions.
    blocking_dependencies:
      - Physical execution campaigns.
    status: stub
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
  - phase_id: "99"
    automation_category: desktop-packaging
    deterministic_authority:
      - Packaging, indexes, checksums, and delivery manifests, when built.
    human_review_boundary:
      - Include/exclude decisions and narrative reporting.
    ai_permitted:
      - Report drafting.
    ai_prohibited:
      - Final deliverable approval.
    status: stub
    migration_source: AUTOMATION_ASSESSMENT.md (2026-07-07)
