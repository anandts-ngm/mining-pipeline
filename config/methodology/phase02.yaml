  - coverage_id: P02-COV-BASEMAP-001
    requirement_ids: [P02-BASEMAP-REFERENCE-001]
    master_refs:
      - methodology.master-v9::02.Phase 2.Basemap processing
    guide_refs:
      - phase02.guide::10.Google high-resolution basemap processing
    resolution_refs: [METH-DISC-052, METH-DISC-065]
    adopted_behavior: Reproject registered input 75 at full extent as district context and input 76 against the 1 km AOI as detailed surface context, preserving both as visual-reference products without positive prospectivity meaning.
    implementation_refs:
      - src/buduunkhad/phases/phase02_remote_sensing.py::Phase02RemoteSensing._do_passthrough
      - src/buduunkhad/core/raster_writers.py::write_cog
    output_refs:
      - XV023222_Buduunkhad_GoogleMaps_BasemapImagery_RGB_2p4m_<full-extent>_EPSG32647_v01.tif
      - XV023222_Buduunkhad_HighResolution_RGB_SurfaceBasemap_0p15m_<1km-buffer>_EPSG32647_v01.tif
    qaqc_checks:
      - Input 75 remains full-extent context and input 76 remains the 1 km detailed context.
