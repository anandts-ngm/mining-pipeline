  - coverage_id: P02-COV-AI-INTERPRETATION-001
    requirement_ids: [P02-AI-INTERPRET-001]
    master_refs:
      - methodology.master-v9::0.Methodology scope and governing principles
      - methodology.master-v9::02.Phase 2.Decision gate
    guide_refs:
      - phase02.guide::16.Most important warning
    resolution_refs: []
    adopted_behavior: Permit deterministic machine lineament drafts and bounded AI interpretation proposals, but require AI_DRAFT lifecycle state and retain deterministic validation and qualified review boundaries before any accepted scientific use.
    implementation_refs:
      - src/buduunkhad/phases/phase02_remote_sensing.py::Phase02RemoteSensing._do_lineaments
      - src/buduunkhad/ai/artifacts.py::AIArtifact
    output_refs:
      - XV023222_Buduunkhad_DEM_Lineament_Draft_EPSG32647_v01.gpkg
      - AI_DRAFT review package
    qaqc_checks:
      - Machine geometry is labelled draft support evidence with source, method and limitations.
      - Provider output cannot create AI_VALIDATED or GEOLOGIST_APPROVED state by itself.
      - Missing or ambiguous interpretation remains a gap rather than a positive feature.
    test_refs:
      - tests/test_phase02_vectors.py::test_extract_lineaments_finds_straight_feature
      - tests/ai/test_contracts.py::test_review_states_are_exact
